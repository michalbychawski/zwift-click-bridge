name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name ZwiftClickBridge `
            --collect-all PySide6 --collect-all bleak `
            scripts/windows_entry.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZwiftClickBridge-windows
          path: dist/ZwiftClickBridge.exe
