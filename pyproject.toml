[project]
name = "zwift-click-bridge"
version = "0.2.1"
description = "Bridges Zwift Click v2 BLE button presses to keyboard key events (e.g. MyWhoosh MyShift I/K)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
    "pynput>=1.7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
zwift-click-bridge = "zwift_click_bridge.app:main"
zwift-click-spike = "zwift_click_bridge.spike:main"
zwift-click-sniff = "zwift_click_bridge.sniff:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
